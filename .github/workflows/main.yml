
name: Build Easy Punch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Android source ZIP
        run: |
          mkdir -p source
          unzip -o Easy_Punch_Android_Source_v13_2_Updated.zip -d source

      - name: Find Android project
        id: project
        shell: bash
        run: |
          FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$FILE" ]; then
            echo "Android project settings.gradle file not found in ZIP"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"
          echo "Project directory: $(dirname "$FILE")"

      - name: Remove duplicate Environment imports
        shell: bash
        run: |
          FILE="$(find source -type f -name MainActivity.kt -print -quit)"
          if [ -z "$FILE" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          lines = p.read_text().splitlines(keepends=True)
          target = "import android.os.Environment"
          seen = False
          result = []
          for line in lines:
              if line.strip() == target:
                  if seen:
                      continue
                  seen = True
              result.append(line)
          p.write_text("".join(result))
          print("Environment import count:", sum(x.strip() == target for x in result))
          PY

      - name: Build debug APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Punch-APK-v13-2
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
