
name: Build TimeOrbit APK v15.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check source ZIP
        run: |
          ls -lh
          unzip -l "TimeOrbit_v15_3_GitHub_Ready.zip" | head -60

      - name: Extract source
        run: |
          mkdir extracted
          unzip -oq "TimeOrbit_v15_3_GitHub_Ready.zip" -d extracted
          find extracted -name settings.gradle.kts -print

      - name: Locate Android project
        run: |
          PROJECT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -1)
          test -n "$PROJECT"
          test -f "$PROJECT/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-v15.3-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
