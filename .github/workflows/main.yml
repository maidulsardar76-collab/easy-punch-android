
name: Build TimeOrbit APK v15.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project files
        run: |
          test -f easy/settings.gradle.kts
          test -f easy/app/build.gradle.kts
          test -f easy/app/src/main/AndroidManifest.xml

      - name: Build TimeOrbit debug APK
        working-directory: easy
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: test -s easy/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-v15.1-debug-APK
          path: easy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
