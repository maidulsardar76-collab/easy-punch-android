name: Build Easy Punch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract updated source ZIP
        run: |
          mkdir source
          unzip -q Easy_Punch_Android_Source_v13_2_Updated.zip -d source

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Punch-APK-v13-2
          path: source/**/app/build/outputs/apk/debug/*.apk
