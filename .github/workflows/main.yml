
name: Build TimeOrbit APK v15.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract TimeOrbit v15.2 source
        shell: bash
        run: |
          set -e
          ZIP="TimeOrbit_v15_2_Final_Audited_Source.zip"
          test -f "$ZIP"
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e
          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found in ZIP."
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          if [ ! -f "$DIR/app/build.gradle.kts" ] && \
             [ ! -f "$DIR/app/build.gradle" ]; then
            echo "Android app Gradle file not found."
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Verify receiver imports
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e
          for FILE in \
            app/src/main/java/com/easypunch/attendance/BootReceiver.kt \
            app/src/main/java/com/easypunch/attendance/TimeReminderReceiver.kt
          do
            grep -Fx \
              'import android.content.BroadcastReceiver' "$FILE"
          done

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-v15.2-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
