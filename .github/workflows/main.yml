name: Build Easy Punch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract updated source ZIP
        run: |
          mkdir -p source
          unzip -q Easy_Punch_Android_Source_v13_2_Updated.zip -d source

      - name: Fix duplicate Environment import
        run: |
          FILE=$(find source -name MainActivity.kt -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi
          awk '!/^import android\.os\.Environment$/ || !seen++' "$FILE" > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"

      - name: Find Android project
        run: |
          SETTINGS=$(find source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Punch-APK-v13-2
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
