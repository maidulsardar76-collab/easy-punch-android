
name: Build Easy Punch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -o Easy_Punch_Android_Source_v13_2_Updated.zip -d source

      - name: Check Android project
        shell: bash
        run: |
          test -f source/easy/settings.gradle.kts
          test -f source/easy/app/build.gradle.kts
          echo "Android project found: source/easy"

      - name: Fix duplicate Environment imports
        shell: bash
        run: |
          FILE="source/easy/app/src/main/java/com/easypunch/attendance/MainActivity.kt"
          test -f "$FILE"
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          lines = p.read_text().splitlines()
          target = "import android.os.Environment"
          result = []
          seen = False

          for line in lines:
              if line.strip() == target:
                  if seen:
                      continue
                  seen = True
              result.append(line)

          if not seen:
              package_index = next(
                  (i for i, line in enumerate(result)
                   if line.startswith("package ")), -1
              )
              if package_index < 0:
                  raise SystemExit("Package declaration not found")
              result.insert(package_index + 2, target)

          p.write_text("\n".join(result) + "\n")
          count = sum(line.strip() == target for line in result)
          print(f"Environment import count: {count}")
          if count != 1:
              raise SystemExit("Environment import fix failed")
          PY

      - name: Build debug APK
        run: gradle -p source/easy assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Punch-APK-v13-2
          path: source/easy/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
