
name: Build TimeOrbit APK v15.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract TimeOrbit source ZIP
        shell: bash
        run: |
          set -e
          ZIP="TimeOrbit_v15_1_Full_Update.zip"

          if [ ! -f "$ZIP" ]; then
            echo "TimeOrbit source ZIP not found: $ZIP"
            echo "ZIP files in repository:"
            find . -maxdepth 3 -iname '*.zip' -print
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found in ZIP."
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Android app Gradle file not found in $PROJECT_DIR/app"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Build TimeOrbit debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeOrbit-v15.1-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
